<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sudoku Arena | 실시간 스도쿠 배틀</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#090e1b;color:#eef4ff}*{box-sizing:border-box}body{margin:0;padding:24px 14px;background:radial-gradient(ellipse at 50% 0,#1a2d52,#090e1b 75%);min-height:100vh}.wrap{max-width:650px;margin:auto}header{text-align:center;margin:10px 0 25px}h1{font-size:36px;margin:4px 0}p,.muted{color:#a5b6d2;font-size:14px}.panel{background:#111c32;border:1px solid #2b3b57;border-radius:18px;padding:18px;margin:14px 0}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tab{background:#1c2a43;color:#e2ecff;border:1px solid #344664;padding:12px 4px;border-radius:12px;font-size:13px}.tab.active{background:#176f6a;border-color:#6de9d2}.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}button{cursor:pointer;border:0;background:#70e8d1;color:#071924;font-weight:750;border-radius:10px;padding:12px}button:disabled{opacity:.45;cursor:default}input,select{background:#0a1427;color:#fff;border:1px solid #3c4c6c;border-radius:10px;padding:12px;font-size:16px;min-width:0}input{width:100%}.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px}.score{padding:12px;background:#0b1529;border-radius:12px;text-align:center}.score strong{font-size:25px;color:#70e8d1}#grid{display:grid;grid-template-columns:repeat(9,1fr);border:3px solid #c6d9ff;max-width:540px;margin:18px auto;aspect-ratio:1}.cell{padding:0;background:#14213a;color:#eaf1ff;border:1px solid #40516f;border-radius:0;font-size:clamp(14px,3.8vw,24px);font-weight:700}.cell.given{background:#283c5a}.cell.selected{background:#237b78}.cell.claimed{background:#334d42}.cell:nth-child(3n){border-right:2px solid #a8bfdf}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #a8bfdf}.numpad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}.numpad button{padding:12px 0}.hidden{display:none}.alert{color:#ffca83;min-height:20px}.chatlog{height:130px;overflow:auto;background:#091324;border-radius:10px;padding:10px;font-size:13px}.chatlog div{padding:3px}#clock{font-weight:800;color:#70e8d1}@media(max-width:420px){.panel{padding:12px}.cell{font-size:17px}.tab{font-size:12px;padding:10px 2px}}</style></head><body><main class="wrap"><header><div class="muted">⚡ LIVE MULTIPLAYER</div><h1>🧩 SUDOKU ARENA</h1><p>친구와 링크 하나로 즐기는 실시간 스도쿠 배틀</p></header><section class="panel"><strong>게임 모드 선택</strong><div class="tabs" style="margin-top:12px"><button class="tab active" data-mode="speed">⏱️ 스피드 배틀</button><button class="tab" data-mode="score">🏆 점수 쟁탈전</button><button class="tab" data-mode="territory">⚔️ 영역 점령전</button></div><p id="desc">같은 퍼즐을 먼저 완성하면 승리합니다.</p><div class="row"><label for="difficulty">난이도</label><select id="difficulty"><option value="easy">쉬움</option><option value="normal" selected>보통</option><option value="hard">어려움</option></select><span class="muted">🔒 비공개 초대방</span></div></section><section class="panel"><div class="row"><input id="invite" readonly aria-label="초대 링크"><button id="copy">링크 복사</button></div><p class="muted">링크를 친구에게 보내세요. 2~4명이 함께 즐길 수 있어요. 모두 입장한 뒤 방장이 시작하세요.</p><div class="row"><input id="nick" maxlength="16" placeholder="닉네임" value="플레이어"><button id="join" disabled>입장</button><button id="start" disabled>시작</button></div><p id="status" class="alert">연결 중…</p></section><section class="panel"><div class="row" style="justify-content:space-between"><strong id="modeTitle">스피드 배틀</strong><span id="clock">대기 중</span></div><div class="scores" id="scores"><div class="score">플레이어 1<br><strong id="s1">0</strong><div id="p1" class="muted">0칸</div></div><div class="score">플레이어 2<br><strong id="s2">0</strong><div id="p2" class="muted">0칸</div></div></div><div id="grid" aria-label="스도쿠 퍼즐"></div><div class="numpad" id="numbers"></div><p id="turn"></p><button id="pass" class="hidden">차례 넘기기</button><p id="result" class="alert"></p><button id="restart" class="hidden">대기실로 돌아가기</button></section><section class="panel"><strong>💬 실시간 채팅</strong><div id="chatlog" class="chatlog" style="margin:10px 0"></div><div class="row"><input id="chat" placeholder="메시지 입력"><button id="sendChat">전송</button></div></section><p class="muted">계정 없이 이용 · 초대 링크를 아는 사람만 입장<br>서버가 재시작되면 진행 중인 방과 채팅이 초기화됩니다.</p></main><script src="/client.js"></script></body></html>
